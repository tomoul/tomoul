name: Release to Hugging Face

# ==========================================================================
# Tag-based release workflow
# ==========================================================================
# Supports two tag formats:
#   - v1.0.0           → Build ALL models (major releases)
#   - silero_vad-v1.0.0 → Build only silero_vad model
#   - whisper_tiny-v2.0.0 → Build only whisper_tiny model
#
# This allows releasing individual models without rebuilding everything.
# For a community project with 100+ models, this prevents 900+ CI jobs.
# ==========================================================================

on:
  push:
    tags:
      - 'v*'      # All models: v1.0.0, v2.0.0-beta
      - '*-v*'    # Single model: silero_vad-v1.0.0, whisper_tiny-v2.0.0
  workflow_dispatch:  # Allow manual trigger
    inputs:
      model:
        description: 'Model to build (leave empty for all)'
        required: false
        default: ''

env:
  ZIG_VERSION: '0.15.2'

jobs:
  # ==========================================================================
  # Job 0: Discover models from registry + parse tag for filtering
  # ==========================================================================
  discover-models:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.parse.outputs.models }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse tag and discover models
        id: parse
        run: |
          # Get all models from registry
          REGISTRY_PATH="src/models/registry.zig"
          all_models=$(grep -v '//' "$REGISTRY_PATH" | grep -oP '\.name = "\K[^"]+')
          all_models_json=$(echo "$all_models" | jq -R -s -c 'split("\n") | map(select(. != ""))')

          echo "All registered models: $all_models"

          # Parse the tag to determine which model(s) to build
          TAG="${{ github.ref_name }}"
          echo "Tag: $TAG"

          # Check if manual trigger with specific model
          if [ -n "${{ github.event.inputs.model }}" ]; then
            # Manual trigger with specific model
            models_json='["${{ github.event.inputs.model }}"]'
            version="manual"
            echo "Manual trigger for model: ${{ github.event.inputs.model }}"

          elif [[ "$TAG" =~ ^v[0-9] ]]; then
            # Tag format: v1.0.0 → build ALL models
            models_json="$all_models_json"
            version="$TAG"
            echo "Building ALL models for release $TAG"

          elif [[ "$TAG" =~ ^(.+)-v([0-9].*)$ ]]; then
            # Tag format: silero_vad-v1.0.0 → build only that model
            model_name="${BASH_REMATCH[1]}"
            version="v${BASH_REMATCH[2]}"

            # Verify the model exists in registry
            if echo "$all_models" | grep -q "^${model_name}$"; then
              models_json="[\"${model_name}\"]"
              echo "Building single model: $model_name (version: $version)"
            else
              echo "ERROR: Model '$model_name' not found in registry!"
              echo "Available models: $all_models"
              exit 1
            fi

          else
            # Unknown tag format
            echo "ERROR: Unknown tag format: $TAG"
            echo "Expected: v1.0.0 (all models) or model_name-v1.0.0 (single model)"
            exit 1
          fi

          echo "models=$models_json" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Final models to build: $models_json"

      - name: Extract model metadata
        run: |
          python3 << 'EOF'
          import re
          import json
          from pathlib import Path

          # Derive paths from model name (convention over configuration)
          def derive_paths(name):
              dashed = name.replace('_', '-')
              return {
                  'weights_path': f'artifacts/{name}.tl',
                  'hf_repo': f'tomoul/{dashed}',
                  'c_binding': f'src/models/{name}/c.zig',
              }

          registry_path = Path('src/models/registry.zig')
          content = registry_path.read_text()

          # Remove comments before parsing
          content_no_comments = re.sub(r'//[^\n]*', '', content)

          models = {}
          # Find models array content
          models_match = re.search(r'pub const models = \[_\]ModelConfig\{(.*?)\};', content_no_comments, re.DOTALL)
          if models_match:
              models_content = models_match.group(1)

              # Parse each model block by tracking brace depth
              depth = 0
              current_block = ""
              blocks = []
              for char in models_content:
                  if char == '{':
                      depth += 1
                      current_block += char
                  elif char == '}':
                      depth -= 1
                      current_block += char
                      if depth == 0 and current_block.strip():
                          blocks.append(current_block)
                          current_block = ""
                  else:
                      if depth > 0:
                          current_block += char

              for block in blocks:
                  name_match = re.search(r'\.name\s*=\s*"([^"]+)"', block)
                  if not name_match:
                      continue
                  name = name_match.group(1)

                  desc_match = re.search(r'\.description\s*=\s*"([^"]*)"', block)
                  symbols_match = re.search(r'\.export_symbols\s*=\s*&\.{([^}]+)}', block, re.DOTALL)

                  # Derive paths from model name
                  paths = derive_paths(name)

                  models[name] = {
                      'weights_path': paths['weights_path'],
                      'hf_repo': paths['hf_repo'],
                      'description': desc_match.group(1) if desc_match else name,
                      'c_binding': paths['c_binding'],
                      'export_symbols': re.findall(r'"([^"]+)"', symbols_match.group(1)) if symbols_match else [],
                  }

          with open('model_metadata.json', 'w') as f:
              json.dump(models, f, indent=2)
          print(json.dumps(models, indent=2))
          EOF

      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: model-metadata
          path: model_metadata.json

  # ==========================================================================
  # Job 1: Generate Model Weights
  # ==========================================================================
  generate-weights:
    needs: discover-models
    runs-on: ubuntu-latest
    strategy:
      matrix:
        model: ${{ fromJson(needs.discover-models.outputs.models) }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r tools/requirements.txt

      - name: Generate model weights
        run: |
          MODEL="${{ matrix.model }}"

          # Run the model-specific export script
          mkdir -p artifacts
          if [ -f "tools/export_${MODEL}.py" ]; then
            echo "Running tools/export_${MODEL}.py..."
            python tools/export_${MODEL}.py -o artifacts/
          else
            echo "No export script found for ${MODEL}, skipping..."
          fi

      - name: Upload weights
        uses: actions/upload-artifact@v4
        with:
          name: weights-${{ matrix.model }}
          path: artifacts/*.tl

  # ==========================================================================
  # Job 2: Generate C Header (from C binding file)
  # ==========================================================================
  generate-header:
    needs: discover-models
    runs-on: ubuntu-latest
    strategy:
      matrix:
        model: ${{ fromJson(needs.discover-models.outputs.models) }}

    steps:
      - uses: actions/checkout@v4

      - name: Download metadata
        uses: actions/download-artifact@v4
        with:
          name: model-metadata
          path: .

      - name: Generate C header from binding file
        run: |
          mkdir -p artifacts/include
          MODEL="${{ matrix.model }}"

          # Use release.py to generate the header from c_binding file
          python3 << 'PYTHON'
          import sys
          sys.path.insert(0, 'scripts')
          from release import generate_c_header, MODELS
          from pathlib import Path

          model = "${{ matrix.model }}"
          output_dir = Path("artifacts/include")
          generate_c_header(model, output_dir)
          PYTHON

      - name: Upload header
        uses: actions/upload-artifact@v4
        with:
          name: header-${{ matrix.model }}
          path: artifacts/

  # ==========================================================================
  # Job 3: Build WebAssembly
  # ==========================================================================
  build-wasm:
    needs: [discover-models, generate-weights]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        model: ${{ fromJson(needs.discover-models.outputs.models) }}

    steps:
      - uses: actions/checkout@v4

      - name: Download model weights
        uses: actions/download-artifact@v4
        with:
          name: weights-${{ matrix.model }}
          path: artifacts/

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build WASM
        run: zig build wasm -Dmodel=${{ matrix.model }}

      - name: Rename artifacts
        run: |
          mkdir -p artifacts/bin
          cp zig-out/bin/tomoul_${{ matrix.model }}.wasm \
             artifacts/bin/tomoul_${{ matrix.model }}_web_wasm32_bundled.wasm

      - name: Upload WASM
        uses: actions/upload-artifact@v4
        with:
          name: wasm-${{ matrix.model }}
          path: artifacts/

  # ==========================================================================
  # Job 4: Build Linux (executable, static lib, shared lib)
  # ==========================================================================
  build-linux:
    needs: [discover-models, generate-weights]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        model: ${{ fromJson(needs.discover-models.outputs.models) }}
        arch: [x86_64, aarch64]

    steps:
      - uses: actions/checkout@v4

      - name: Download model weights
        uses: actions/download-artifact@v4
        with:
          name: weights-${{ matrix.model }}
          path: artifacts/

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build Linux artifacts
        run: |
          TARGET="${{ matrix.arch }}-linux"
          MODEL="${{ matrix.model }}"

          # Build executable
          zig build -Dtarget=$TARGET -Doptimize=ReleaseFast || true

          # Build bundled libraries (with embedded weights)
          zig build lib -Dmodel=$MODEL -Dtarget=$TARGET -Doptimize=ReleaseSmall -Dbundled=true || true

      - name: Organize artifacts
        run: |
          mkdir -p artifacts/bin artifacts/lib
          MODEL="${{ matrix.model }}"
          ARCH="${{ matrix.arch }}"

          # Executable
          if [ -f zig-out/bin/tomoul ]; then
            cp zig-out/bin/tomoul artifacts/bin/tomoul_linux_${ARCH}_bundled
          fi

          # Libraries from build system
          if [ -f zig-out/lib/libtomoul_${MODEL}.a ]; then
            cp zig-out/lib/libtomoul_${MODEL}.a artifacts/lib/libtomoul_${MODEL}_linux_${ARCH}.a
          fi

          if [ -f zig-out/lib/libtomoul_${MODEL}.so ]; then
            cp zig-out/lib/libtomoul_${MODEL}.so artifacts/lib/libtomoul_${MODEL}_linux_${ARCH}.so
          fi

          ls -la artifacts/ || true
          ls -la artifacts/bin/ || true
          ls -la artifacts/lib/ || true

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.model }}-${{ matrix.arch }}
          path: artifacts/

  # ==========================================================================
  # Job 5: Build macOS (executable, static lib, dylib)
  # ==========================================================================
  build-macos:
    needs: [discover-models, generate-weights]
    runs-on: macos-latest
    strategy:
      matrix:
        model: ${{ fromJson(needs.discover-models.outputs.models) }}
        arch: [x86_64, aarch64]

    steps:
      - uses: actions/checkout@v4

      - name: Download model weights
        uses: actions/download-artifact@v4
        with:
          name: weights-${{ matrix.model }}
          path: artifacts/

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build macOS artifacts
        run: |
          TARGET="${{ matrix.arch }}-macos"
          MODEL="${{ matrix.model }}"

          # Build executable
          zig build -Dtarget=$TARGET -Doptimize=ReleaseFast || true

          # Build bundled libraries (with embedded weights)
          zig build lib -Dmodel=$MODEL -Dtarget=$TARGET -Doptimize=ReleaseSmall -Dbundled=true || true

      - name: Organize artifacts
        run: |
          mkdir -p artifacts/bin artifacts/lib
          MODEL="${{ matrix.model }}"
          ARCH="${{ matrix.arch }}"

          # Executable
          if [ -f zig-out/bin/tomoul ]; then
            cp zig-out/bin/tomoul artifacts/bin/tomoul_mac_${ARCH}_bundled
          fi

          # Libraries from build system
          if [ -f zig-out/lib/libtomoul_${MODEL}.a ]; then
            cp zig-out/lib/libtomoul_${MODEL}.a artifacts/lib/libtomoul_${MODEL}_mac_${ARCH}.a
          fi

          if [ -f zig-out/lib/libtomoul_${MODEL}.dylib ]; then
            cp zig-out/lib/libtomoul_${MODEL}.dylib artifacts/lib/libtomoul_${MODEL}_mac_${ARCH}.dylib
          fi

          ls -la artifacts/ || true
          ls -la artifacts/bin/ || true
          ls -la artifacts/lib/ || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.model }}-${{ matrix.arch }}
          path: artifacts/

  # ==========================================================================
  # Job 6: Build iOS (static lib only)
  # ==========================================================================
  build-ios:
    needs: [discover-models, generate-weights]
    runs-on: macos-latest
    strategy:
      matrix:
        model: ${{ fromJson(needs.discover-models.outputs.models) }}
        arch: [aarch64]  # iOS is ARM64 only

    steps:
      - uses: actions/checkout@v4

      - name: Download model weights
        uses: actions/download-artifact@v4
        with:
          name: weights-${{ matrix.model }}
          path: artifacts/

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build iOS static library
        run: |
          MODEL="${{ matrix.model }}"

          # Build bundled library with iOS target (embedded weights)
          zig build lib -Dmodel=$MODEL -Dtarget=aarch64-ios -Doptimize=ReleaseSmall -Dbundled=true || true

      - name: Organize artifacts
        run: |
          mkdir -p artifacts/lib
          MODEL="${{ matrix.model }}"

          if [ -f zig-out/lib/libtomoul_${MODEL}.a ]; then
            cp zig-out/lib/libtomoul_${MODEL}.a artifacts/lib/libtomoul_${MODEL}_ios_aarch64.a
          fi

          ls -la artifacts/lib/ || true

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.model }}-${{ matrix.arch }}
          path: artifacts/

  # ==========================================================================
  # Job 7: Build Android (static lib)
  # ==========================================================================
  build-android:
    needs: [discover-models, generate-weights]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        model: ${{ fromJson(needs.discover-models.outputs.models) }}
        arch: [aarch64, x86_64]

    steps:
      - uses: actions/checkout@v4

      - name: Download model weights
        uses: actions/download-artifact@v4
        with:
          name: weights-${{ matrix.model }}
          path: artifacts/

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build Android static library
        run: |
          MODEL="${{ matrix.model }}"
          ARCH="${{ matrix.arch }}"

          # Build bundled library with Android target (embedded weights)
          zig build lib -Dmodel=$MODEL -Dtarget=${ARCH}-linux-android -Doptimize=ReleaseSmall -Dbundled=true || true

      - name: Organize artifacts
        run: |
          mkdir -p artifacts/lib
          MODEL="${{ matrix.model }}"
          ARCH="${{ matrix.arch }}"

          # Map arch to Android ABI names
          if [ "$ARCH" = "aarch64" ]; then
            ABI="arm64-v8a"
          elif [ "$ARCH" = "x86_64" ]; then
            ABI="x86_64"
          else
            ABI="$ARCH"
          fi

          if [ -f zig-out/lib/libtomoul_${MODEL}.a ]; then
            cp zig-out/lib/libtomoul_${MODEL}.a artifacts/lib/libtomoul_${MODEL}_android_${ABI}.a
          fi

          ls -la artifacts/lib/ || true

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.model }}-${{ matrix.arch }}
          path: artifacts/

  # ==========================================================================
  # Job 8: Upload to Hugging Face
  # ==========================================================================
  upload-hf:
    needs: [discover-models, generate-weights, generate-header, build-wasm, build-linux, build-macos, build-ios, build-android]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        model: ${{ fromJson(needs.discover-models.outputs.models) }}

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hugging Face CLI
        run: pip install huggingface_hub

      - name: Organize artifacts for upload
        run: |
          MODEL="${{ matrix.model }}"
          mkdir -p hf-upload/bin hf-upload/lib hf-upload/include

          # Copy header
          find all-artifacts/header-${MODEL} -name "*.h" -exec cp {} hf-upload/include/ \; 2>/dev/null || true

          # Copy WASM
          find all-artifacts/wasm-${MODEL} -name "*.wasm" -exec cp {} hf-upload/bin/ \; 2>/dev/null || true

          # Copy executables
          find all-artifacts/linux-${MODEL}-* all-artifacts/macos-${MODEL}-* -path "*/bin/*" -type f -exec cp {} hf-upload/bin/ \; 2>/dev/null || true

          # Copy libraries
          find all-artifacts -path "*/lib/*" -type f \( -name "*.a" -o -name "*.so" -o -name "*.dylib" \) -exec cp {} hf-upload/lib/ \; 2>/dev/null || true

          # Copy model weights from generated weights artifact
          find all-artifacts/weights-${MODEL} -name "*.tl" -exec cp {} hf-upload/ \; 2>/dev/null || true

          echo "=== Upload structure for $MODEL ==="
          find hf-upload -type f | head -50

      - name: Generate manifest.json
        run: |
          MODEL="${{ matrix.model }}"
          VERSION="${{ github.ref_name }}"
          DESCRIPTION=$(python3 -c "import json; m=json.load(open('all-artifacts/model-metadata/model_metadata.json')); print(m['$MODEL']['description'])")

          # Generate manifest with SHA256 hashes
          python3 << 'MANIFEST_SCRIPT'
          import hashlib
          import json
          from pathlib import Path

          def sha256_file(filepath):
              sha256 = hashlib.sha256()
              with open(filepath, 'rb') as f:
                  for chunk in iter(lambda: f.read(8192), b''):
                      sha256.update(chunk)
              return sha256.hexdigest()

          model = "${{ matrix.model }}"
          version = "${{ github.ref_name }}" or "dev"
          description = """$DESCRIPTION"""

          output_dir = Path("hf-upload")
          artifacts = {}

          for f in sorted(output_dir.rglob("*")):
              if f.is_file() and f.name != "manifest.json":
                  rel_path = str(f.relative_to(output_dir))
                  file_hash = sha256_file(f)
                  file_size = f.stat().st_size

                  # Categorize artifact
                  if f.suffix == ".wasm":
                      key = f"wasm_{f.stem.replace('tomoul_', '').replace('_bundled', '')}"
                  elif f.suffix in [".so", ".dylib"]:
                      key = f"lib_{f.stem.replace('libtomoul_', '').replace(model + '_', '')}_shared"
                  elif f.suffix == ".a":
                      key = f"lib_{f.stem.replace('libtomoul_', '').replace(model + '_', '')}_static"
                  elif f.suffix == ".h":
                      key = "header"
                  elif f.suffix == ".tl":
                      key = "weights"
                  elif f.suffix == ".md":
                      key = "readme"
                  elif f.parent.name == "bin" and not f.suffix:
                      key = f"bin_{f.stem.replace('tomoul_', '').replace('_bundled', '')}"
                  else:
                      key = f.stem

                  artifacts[key] = {
                      "file": rel_path,
                      "sha256": file_hash,
                      "size": file_size,
                  }

          manifest = {
              "model": model,
              "version": version,
              "description": description,
              "artifacts": artifacts,
          }

          manifest_path = output_dir / "manifest.json"
          manifest_path.write_text(json.dumps(manifest, indent=2))
          print(f"Generated {manifest_path}")
          MANIFEST_SCRIPT

      - name: Generate README
        run: |
          MODEL="${{ matrix.model }}"
          HF_REPO=$(python3 -c "import json; m=json.load(open('all-artifacts/model-metadata/model_metadata.json')); print(m['$MODEL']['hf_repo'])")
          DESCRIPTION=$(python3 -c "import json; m=json.load(open('all-artifacts/model-metadata/model_metadata.json')); print(m['$MODEL']['description'])")
          WEIGHTS_FILE=$(python3 -c "import json; import os; m=json.load(open('all-artifacts/model-metadata/model_metadata.json')); print(os.path.basename(m['$MODEL']['weights_path']))")

          # Get export symbols for API documentation
          EXPORT_SYMBOLS=$(python3 -c "import json; m=json.load(open('all-artifacts/model-metadata/model_metadata.json')); print('\n'.join(['| \`' + s + '\` | ' + s.replace('_', ' ').title() + ' |' for s in m['$MODEL'].get('export_symbols', [])]))")

          cat > hf-upload/README.md << HEREDOC
          ---
          license: mit
          tags:
            - tomoul
            - zig
            - wasm
          ---

          # Tomoul ${DESCRIPTION}

          Built with [Tomoul](https://github.com/tomoul/tomoul) - the minimalist AI inference engine in Zig.

          ## Quick Start (Browser)

          \`\`\`javascript
          const response = await fetch('https://huggingface.co/${HF_REPO}/resolve/main/bin/tomoul_${MODEL}_web_wasm32_bundled.wasm');
          const wasm = await WebAssembly.instantiate(await response.arrayBuffer());
          wasm.instance.exports.init();
          \`\`\`

          ## API Reference

          | Function | Description |
          |----------|-------------|
          ${EXPORT_SYMBOLS}

          ## Files

          | File | Description |
          |------|-------------|
          | \`${WEIGHTS_FILE}\` | Raw model weights |
          | \`bin/tomoul_${MODEL}_web_wasm32_bundled.wasm\` | Browser WASM |
          | \`bin/tomoul_linux_x86_64_bundled\` | Linux x64 |
          | \`bin/tomoul_linux_aarch64_bundled\` | Linux ARM64 |
          | \`bin/tomoul_mac_x86_64_bundled\` | macOS Intel |
          | \`bin/tomoul_mac_aarch64_bundled\` | macOS ARM64 |
          | \`include/tomoul_${MODEL}.h\` | C header |
          | \`lib/libtomoul_${MODEL}_*.a\` | Static libraries |
          | \`lib/libtomoul_${MODEL}_*.so\` | Shared libraries (Linux) |
          | \`lib/libtomoul_${MODEL}_*.dylib\` | Dynamic libraries (macOS) |

          ## License

          MIT License
          HEREDOC

      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          MODEL="${{ matrix.model }}"
          HF_REPO=$(python3 -c "import json; m=json.load(open('all-artifacts/model-metadata/model_metadata.json')); print(m['$MODEL']['hf_repo'])")

          huggingface-cli login --token $HF_TOKEN

          # Create repo if needed
          python3 << EOF
          from huggingface_hub import HfApi, repo_exists
          api = HfApi()
          if not repo_exists("$HF_REPO", repo_type="model"):
              print(f"Creating repo: $HF_REPO")
              api.create_repo("$HF_REPO", repo_type="model", exist_ok=True)
          EOF

          huggingface-cli upload "$HF_REPO" hf-upload/ . \
            --repo-type model \
            --commit-message "Release ${{ github.ref_name }}"

          echo "Uploaded to: https://huggingface.co/$HF_REPO"

  # ==========================================================================
  # Job 9: Create GitHub Release
  # ==========================================================================
  create-release:
    needs: [discover-models, upload-hf]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            all-artifacts/**/*
          body: |
            ## Tomoul Release ${{ github.ref_name }}

            ### Models Released
            ${{ needs.discover-models.outputs.models }}

            ### Artifact Types
            - **WASM**: Browser WebAssembly with embedded weights
            - **Executables**: Linux/macOS CLI binaries
            - **Static Libraries**: `.a` files for iOS, Android, Linux, macOS
            - **Shared Libraries**: `.so` (Linux), `.dylib` (macOS)
            - **C Headers**: FFI integration headers

            ### Hugging Face
            All artifacts available at: https://huggingface.co/tomoul
