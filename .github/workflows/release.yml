name: Release to Hugging Face

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (e.g., v1.0.0)
  workflow_dispatch:  # Allow manual trigger
    inputs:
      model:
        description: 'Model to build (leave empty for all)'
        required: false
        default: ''

env:
  ZIG_VERSION: '0.13.0'

jobs:
  # ==========================================================================
  # Job 0: Discover models from model_registry.zig
  # ==========================================================================
  discover-models:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.parse.outputs.models }}
      models_json: ${{ steps.parse.outputs.models_json }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse model_registry.zig
        id: parse
        run: |
          # Extract model names from model_registry.zig
          # Looks for lines like: .name = "silero_vad",
          models=$(grep -oP '\.name = "\K[^"]+' model_registry.zig)

          # Convert to JSON array for matrix
          models_json=$(echo "$models" | jq -R -s -c 'split("\n") | map(select(. != ""))')

          echo "Found models: $models"
          echo "JSON: $models_json"

          # If manual trigger with specific model, filter to just that model
          if [ -n "${{ github.event.inputs.model }}" ]; then
            models_json='["${{ github.event.inputs.model }}"]'
            echo "Filtered to: $models_json"
          fi

          echo "models=$models_json" >> $GITHUB_OUTPUT
          echo "models_json=$models_json" >> $GITHUB_OUTPUT

      - name: Extract model metadata
        id: metadata
        run: |
          # Create a JSON file with full model metadata for the upload job
          python3 << 'EOF'
          import re
          import json

          with open('model_registry.zig', 'r') as f:
              content = f.read()

          # Parse model configs
          models = {}
          # Find each model block
          pattern = r'\.name = "([^"]+)".*?\.weights_path = "([^"]+)".*?\.hf_repo = "([^"]*)".*?\.description = "([^"]*)"'

          for match in re.finditer(pattern, content, re.DOTALL):
              name, weights, hf_repo, desc = match.groups()
              models[name] = {
                  'weights_path': weights,
                  'hf_repo': hf_repo or f'tomoul/{name.replace("_", "-")}',
                  'description': desc or name,
              }

          print(json.dumps(models, indent=2))

          with open('model_metadata.json', 'w') as f:
              json.dump(models, f)
          EOF

          cat model_metadata.json

      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: model-metadata
          path: model_metadata.json

  # ==========================================================================
  # Job 1: Build WebAssembly artifacts
  # ==========================================================================
  build-wasm:
    needs: discover-models
    runs-on: ubuntu-latest
    strategy:
      matrix:
        model: ${{ fromJson(needs.discover-models.outputs.models) }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build WASM (bundled)
        run: zig build wasm -Dmodel=${{ matrix.model }}

      - name: Rename artifacts with full naming convention
        run: |
          mkdir -p artifacts
          # Bundled WASM for web
          cp zig-out/bin/tomoul_${{ matrix.model }}.wasm \
             artifacts/tomoul_${{ matrix.model }}_web_wasm32_bundled.wasm

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-${{ matrix.model }}
          path: artifacts/

  # ==========================================================================
  # Job 2: Build Native Linux artifacts
  # ==========================================================================
  build-linux:
    needs: discover-models
    runs-on: ubuntu-latest
    strategy:
      matrix:
        model: ${{ fromJson(needs.discover-models.outputs.models) }}
        arch: [x86_64, aarch64]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build native Linux
        run: |
          # Build main executable for Linux
          zig build -Dtarget=${{ matrix.arch }}-linux -Doptimize=ReleaseFast

      - name: Rename artifacts
        run: |
          mkdir -p artifacts
          if [ -f zig-out/bin/tomoul ]; then
            cp zig-out/bin/tomoul artifacts/tomoul_linux_${{ matrix.arch }}_bundled
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.model }}-${{ matrix.arch }}
          path: artifacts/

  # ==========================================================================
  # Job 3: Build Native macOS artifacts
  # ==========================================================================
  build-macos:
    needs: discover-models
    runs-on: macos-latest
    strategy:
      matrix:
        model: ${{ fromJson(needs.discover-models.outputs.models) }}
        arch: [x86_64, aarch64]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build native macOS
        run: |
          zig build -Dtarget=${{ matrix.arch }}-macos -Doptimize=ReleaseFast

      - name: Rename artifacts
        run: |
          mkdir -p artifacts
          if [ -f zig-out/bin/tomoul ]; then
            cp zig-out/bin/tomoul artifacts/tomoul_mac_${{ matrix.arch }}_bundled
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.model }}-${{ matrix.arch }}
          path: artifacts/

  # ==========================================================================
  # Job 4: Upload to Hugging Face (per model)
  # ==========================================================================
  upload-hf:
    needs: [discover-models, build-wasm, build-linux, build-macos]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        model: ${{ fromJson(needs.discover-models.outputs.models) }}

    steps:
      - uses: actions/checkout@v4

      - name: Download model metadata
        uses: actions/download-artifact@v4
        with:
          name: model-metadata
          path: .

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-${{ matrix.model }}
          path: artifacts/wasm

      - name: Download Linux x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.model }}-x86_64
          path: artifacts/linux-x86_64

      - name: Download Linux aarch64 artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.model }}-aarch64
          path: artifacts/linux-aarch64

      - name: Download macOS x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-${{ matrix.model }}-x86_64
          path: artifacts/macos-x86_64

      - name: Download macOS aarch64 artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-${{ matrix.model }}-aarch64
          path: artifacts/macos-aarch64

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hugging Face CLI
        run: pip install huggingface_hub

      - name: Organize artifacts for upload
        run: |
          mkdir -p hf-upload/bin

          # Collect all artifacts into bin/
          find artifacts -type f \( -name "*.wasm" -o ! -name "*.*" \) -exec cp {} hf-upload/bin/ \;

          # Get model metadata
          MODEL_NAME="${{ matrix.model }}"
          WEIGHTS_PATH=$(python3 -c "import json; m=json.load(open('model_metadata.json')); print(m['$MODEL_NAME']['weights_path'])")

          # Copy model weights
          if [ -f "$WEIGHTS_PATH" ]; then
            cp "$WEIGHTS_PATH" "hf-upload/$(basename $WEIGHTS_PATH)"
          fi

          # List what we're uploading
          echo "=== Artifacts to upload for $MODEL_NAME ==="
          ls -la hf-upload/
          ls -la hf-upload/bin/

      - name: Generate README for HF repo
        run: |
          MODEL_NAME="${{ matrix.model }}"
          HF_REPO=$(python3 -c "import json; m=json.load(open('model_metadata.json')); print(m['$MODEL_NAME']['hf_repo'])")
          DESCRIPTION=$(python3 -c "import json; m=json.load(open('model_metadata.json')); print(m['$MODEL_NAME']['description'])")
          WEIGHTS_FILE=$(python3 -c "import json; import os; m=json.load(open('model_metadata.json')); print(os.path.basename(m['$MODEL_NAME']['weights_path']))")

          cat > hf-upload/README.md << HEREDOC
          ---
          license: mit
          tags:
            - tomoul
            - zig
            - wasm
          ---

          # Tomoul ${DESCRIPTION}

          Built with [Tomoul](https://github.com/tomoul/tomoul) - the minimalist AI inference engine in Zig.

          ## Quick Start (Browser)

          \`\`\`javascript
          const response = await fetch('https://huggingface.co/${HF_REPO}/resolve/main/bin/tomoul_${MODEL_NAME}_web_wasm32_bundled.wasm');
          const wasm = await WebAssembly.instantiate(await response.arrayBuffer());
          wasm.instance.exports.init();
          \`\`\`

          ## Quick Start (Linux CLI)

          \`\`\`bash
          wget https://huggingface.co/${HF_REPO}/resolve/main/bin/tomoul_linux_x86_64_bundled
          chmod +x tomoul_linux_x86_64_bundled
          ./tomoul_linux_x86_64_bundled input.wav
          \`\`\`

          ## Files

          | File | Description |
          |------|-------------|
          | \`${WEIGHTS_FILE}\` | Raw model weights (Tomoul format) |
          | \`bin/tomoul_${MODEL_NAME}_web_wasm32_bundled.wasm\` | Browser WASM with embedded weights |
          | \`bin/tomoul_linux_x86_64_bundled\` | Linux x64 executable |
          | \`bin/tomoul_linux_aarch64_bundled\` | Linux ARM64 executable |
          | \`bin/tomoul_mac_x86_64_bundled\` | macOS Intel executable |
          | \`bin/tomoul_mac_aarch64_bundled\` | macOS Apple Silicon executable |

          ## License

          MIT License - See [Tomoul](https://github.com/tomoul/tomoul) for details.
          HEREDOC

      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          MODEL_NAME="${{ matrix.model }}"
          HF_REPO=$(python3 -c "import json; m=json.load(open('model_metadata.json')); print(m['$MODEL_NAME']['hf_repo'])")

          # Login to Hugging Face
          huggingface-cli login --token $HF_TOKEN

          # Create repo if it doesn't exist
          python3 << EOF
          from huggingface_hub import HfApi, repo_exists
          api = HfApi()
          if not repo_exists("$HF_REPO", repo_type="model"):
              print(f"Creating repo: $HF_REPO")
              api.create_repo("$HF_REPO", repo_type="model", exist_ok=True)
          EOF

          # Upload
          huggingface-cli upload "$HF_REPO" hf-upload/ . \
            --repo-type model \
            --commit-message "Release ${{ github.ref_name }}"

          echo "Uploaded to: https://huggingface.co/$HF_REPO"

  # ==========================================================================
  # Job 5: Create GitHub Release
  # ==========================================================================
  create-release:
    needs: [discover-models, upload-hf]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            all-artifacts/**/*
          body: |
            ## Tomoul Release ${{ github.ref_name }}

            ### Models Released
            ${{ needs.discover-models.outputs.models }}

            ### Hugging Face
            All artifacts are available on Hugging Face:
            - https://huggingface.co/tomoul
