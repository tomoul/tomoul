<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentence Transformer - WebGPU Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; padding: 2rem; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #f97316; margin-bottom: 0.5rem; }
        .subtitle { color: #94a3b8; margin-bottom: 2rem; }
        .badge { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 0.25rem; font-size: 0.75rem; font-weight: 600; }
        .badge-gpu { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .badge-wasm { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .badge-err { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .status { margin-bottom: 1.5rem; padding: 0.75rem; background: #1e293b; border-radius: 0.5rem; font-size: 0.875rem; }
        .status-ok { border-left: 3px solid #4ade80; }
        .status-loading { border-left: 3px solid #fbbf24; }
        .status-err { border-left: 3px solid #f87171; }
        .input-group { margin-bottom: 1.5rem; }
        label { display: block; color: #94a3b8; margin-bottom: 0.5rem; font-size: 0.875rem; }
        textarea { width: 100%; padding: 0.75rem; background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; color: #e2e8f0; font-size: 0.95rem; resize: vertical; min-height: 80px; }
        textarea:focus { outline: none; border-color: #f97316; }
        button { background: #f97316; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-size: 1rem; cursor: pointer; margin-right: 0.5rem; margin-bottom: 0.5rem; }
        button:hover { background: #ea580c; }
        button:disabled { background: #475569; cursor: not-allowed; }
        .examples { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
        .examples button { background: #1e293b; border: 1px solid #334155; font-size: 0.8rem; padding: 0.5rem 0.75rem; }
        .examples button:hover { border-color: #f97316; }
        .result { background: #1e293b; border-radius: 0.5rem; padding: 1rem; margin-top: 1rem; }
        .result h3 { color: #f97316; margin-bottom: 0.75rem; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.75rem; margin-bottom: 1rem; }
        .stat { background: #0f172a; padding: 0.75rem; border-radius: 0.375rem; }
        .stat-label { color: #64748b; font-size: 0.75rem; text-transform: uppercase; }
        .stat-value { color: #f8fafc; font-size: 1.25rem; font-weight: 600; }
        .similarity-matrix { margin-top: 1rem; }
        .similarity-matrix table { width: 100%; border-collapse: collapse; }
        .similarity-matrix th, .similarity-matrix td { padding: 0.5rem; text-align: center; border: 1px solid #334155; font-size: 0.8rem; }
        .similarity-matrix th { background: #0f172a; color: #94a3b8; }
        .sim-high { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .sim-mid { background: rgba(234, 179, 8, 0.15); color: #fbbf24; }
        .sim-low { background: rgba(239, 68, 68, 0.1); color: #f87171; }
        .embedding-preview { font-family: monospace; font-size: 0.75rem; color: #64748b; word-break: break-all; max-height: 60px; overflow: hidden; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sentence Transformer <span class="badge badge-gpu">WebGPU</span> <span class="badge badge-wasm">WASM</span></h1>
        <p class="subtitle">all-MiniLM-L6-v2 &middot; 384-dim embeddings &middot; Powered by Tomoul &middot; 100% client-side</p>

        <div id="status" class="status status-loading">Checking WebGPU support...</div>

        <div class="input-group">
            <label>Enter sentences (one per line):</label>
            <textarea id="input" rows="6">The quick brown fox jumps over the lazy dog
Machine learning is a subset of artificial intelligence
I had pizza for lunch yesterday</textarea>
        </div>

        <button id="embedBtn" onclick="embed()" disabled>Generate Embeddings</button>

        <div class="examples">
            <button onclick="loadExample('semantic')">Semantic Similarity</button>
            <button onclick="loadExample('diverse')">Diverse Topics</button>
            <button onclick="loadExample('paraphrase')">Paraphrases</button>
        </div>

        <div id="result" class="result" style="display:none;">
            <h3>Results</h3>
            <div class="stats" id="stats"></div>
            <div class="similarity-matrix" id="simMatrix"></div>
            <div id="embPreview" class="embedding-preview" style="margin-top: 1rem;"></div>
        </div>
    </div>

    <script type="module">
        import { TomoulWebGpuBridge } from './webgpu-bridge.js';

        const EXAMPLES = {
            semantic: "Dogs are wonderful pets\nCats are great companions\nPython is a programming language\nJava is used for backend development",
            diverse: "The weather is nice today\nQuantum physics describes subatomic particles\nI enjoy cooking Italian food\nThe stock market rallied this week\nPhotosynthesis converts sunlight to energy",
            paraphrase: "The movie was excellent\nThe film was really great\nI didn't enjoy the movie at all\nThe movie was terrible",
        };

        // Expose to global scope for onclick handlers
        window.loadExample = function(name) {
            document.getElementById('input').value = EXAMPLES[name];
        };

        const statusEl = document.getElementById('status');
        const embedBtn = document.getElementById('embedBtn');

        let bridge = null;
        let wasmInstance = null;

        async function initWebGPU() {
            if (!navigator.gpu) {
                statusEl.className = 'status status-err';
                statusEl.innerHTML = '<span class="badge badge-err">Not Supported</span> WebGPU is not available in this browser. Try Chrome 113+ or Edge 113+.';
                return;
            }

            statusEl.textContent = 'Initializing WebGPU...';
            bridge = new TomoulWebGpuBridge();
            const ok = await bridge.init();
            if (!ok) {
                statusEl.className = 'status status-err';
                statusEl.innerHTML = '<span class="badge badge-err">Error</span> No WebGPU adapter found.';
                return;
            }

            statusEl.textContent = `WebGPU ready (${bridge.deviceName}). Loading WASM model...`;

            try {
                wasmInstance = await bridge.loadWasm('tomoul_sentence_transformer.wasm');
                const exports = wasmInstance.exports;

                // Initialize the model
                let initResult = 0;
                if (exports.init) initResult = exports.init();
                const heapUsed = exports.get_heap_used ? exports.get_heap_used() : '?';
                const heapSize = exports.get_heap_size ? exports.get_heap_size() : '?';
                console.log('init() returned:', initResult, 'heap:', heapUsed, '/', heapSize);

                // Check readiness
                if (initResult !== 1) {
                    const errMap = {2:'out of memory', 3:'data/parse error'};
                    const reason = errMap[initResult] || `code ${initResult}`;
                    statusEl.className = 'status status-err';
                    statusEl.innerHTML = `<span class="badge badge-err">Error</span> Init failed: ${reason} (heap: ${(heapUsed/1048576).toFixed(1)}MB / ${(heapSize/1048576).toFixed(1)}MB)`;
                    return;
                }

                const version = '';
                if (exports.get_version) {
                    const vPtr = exports.get_version();
                    // version is a pointer to a null-terminated string in WASM memory
                }

                statusEl.className = 'status status-ok';
                statusEl.innerHTML = `<span class="badge badge-gpu">GPU Ready</span> ${bridge.deviceName} &middot; Model loaded &middot; WebGPU + WASM`;
                embedBtn.disabled = false;
            } catch (e) {
                statusEl.className = 'status status-err';
                statusEl.innerHTML = `<span class="badge badge-err">Error</span> Failed to load WASM model: ${e.message}`;
                console.error(e);
            }
        }

        window.embed = async function() {
            if (!bridge || !wasmInstance) return;

            const btn = embedBtn;
            btn.disabled = true;
            btn.textContent = 'Computing...';

            const sentences = document.getElementById('input').value.split('\n').filter(s => s.trim());
            if (sentences.length === 0) {
                btn.disabled = false;
                btn.textContent = 'Generate Embeddings';
                return;
            }

            try {
                const embeddings = [];
                const t0 = performance.now();

                for (const sentence of sentences) {
                    const emb = await bridge.embed(wasmInstance, sentence);
                    embeddings.push(emb);
                }

                const elapsed = performance.now() - t0;
                showResults(sentences, embeddings, elapsed);
            } catch (e) {
                console.error('Embedding failed:', e);
                statusEl.className = 'status status-err';
                statusEl.innerHTML = `<span class="badge badge-err">Error</span> ${e.message}`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Generate Embeddings';
            }
        };

        function showResults(sentences, embeddings, elapsed) {
            document.getElementById('result').style.display = 'block';

            const dim = embeddings[0].length;
            const perSentence = (elapsed / sentences.length).toFixed(1);
            document.getElementById('stats').innerHTML = `
                <div class="stat"><div class="stat-label">Sentences</div><div class="stat-value">${sentences.length}</div></div>
                <div class="stat"><div class="stat-label">Dimensions</div><div class="stat-value">${dim}</div></div>
                <div class="stat"><div class="stat-label">Total Time</div><div class="stat-value">${elapsed.toFixed(1)}ms</div></div>
                <div class="stat"><div class="stat-label">Per Sentence</div><div class="stat-value">${perSentence}ms</div></div>
                <div class="stat"><div class="stat-label">Backend</div><div class="stat-value">WebGPU</div></div>
            `;

            // Similarity matrix
            if (sentences.length > 1) {
                let html = '<table><tr><th></th>';
                for (let i = 0; i < sentences.length; i++) {
                    html += `<th title="${escapeHtml(sentences[i])}">${truncate(sentences[i], 20)}</th>`;
                }
                html += '</tr>';

                for (let i = 0; i < sentences.length; i++) {
                    html += `<tr><th title="${escapeHtml(sentences[i])}">${truncate(sentences[i], 20)}</th>`;
                    for (let j = 0; j < sentences.length; j++) {
                        const sim = cosineSim(embeddings[i], embeddings[j]);
                        const cls = sim > 0.7 ? 'sim-high' : sim > 0.4 ? 'sim-mid' : 'sim-low';
                        html += `<td class="${cls}">${sim.toFixed(3)}</td>`;
                    }
                    html += '</tr>';
                }
                html += '</table>';
                document.getElementById('simMatrix').innerHTML = html;
            }

            // Preview first embedding
            const preview = Array.from(embeddings[0].slice(0, 10)).map(v => v.toFixed(4)).join(', ');
            document.getElementById('embPreview').textContent = `First embedding: [${preview}, ... ] (${dim} dims)`;
        }

        function cosineSim(a, b) {
            let dot = 0, na = 0, nb = 0;
            for (let i = 0; i < a.length; i++) {
                dot += a[i] * b[i];
                na += a[i] * a[i];
                nb += b[i] * b[i];
            }
            return dot / (Math.sqrt(na) * Math.sqrt(nb));
        }

        function truncate(s, n) {
            return s.length > n ? s.slice(0, n) + '…' : s;
        }

        function escapeHtml(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // Init on load
        initWebGPU();
    </script>
</body>
</html>
