<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tomoul — Qwen3.5 Chat</title>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --user-bg: #1f2937; --bot-bg: #161b22;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --mono: 'Cascadia Code', 'Fira Code', Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font); background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; height: 100vh;
  }

  /* Header */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  header h1 { font-size: 16px; font-weight: 600; }
  header .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 12px;
    background: #1f6feb22; color: var(--accent); border: 1px solid #1f6feb44;
  }
  header .status {
    margin-left: auto; font-size: 12px; color: var(--muted);
  }
  header .status.online::before {
    content: ''; display: inline-block; width: 7px; height: 7px;
    border-radius: 50%; background: #3fb950; margin-right: 6px;
  }
  header .status.busy::before {
    content: ''; display: inline-block; width: 7px; height: 7px;
    border-radius: 50%; background: #d29922; margin-right: 6px;
  }

  /* Chat area */
  #chat {
    flex: 1; overflow-y: auto; padding: 20px; display: flex;
    flex-direction: column; gap: 16px;
  }

  .msg { max-width: 720px; width: 100%; margin: 0 auto; display: flex; gap: 12px; }
  .msg.user { flex-direction: row-reverse; }
  .msg .avatar {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600;
  }
  .msg.user .avatar { background: #1f6feb; color: #fff; }
  .msg.bot .avatar  { background: #238636; color: #fff; }

  .msg .bubble {
    padding: 10px 14px; border-radius: 12px; line-height: 1.6;
    font-size: 14px; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: var(--user-bg); border-radius: 12px 12px 4px 12px; }
  .msg.bot  .bubble { background: var(--bot-bg); border: 1px solid var(--border); border-radius: 12px 12px 12px 4px; }

  .msg .meta {
    font-size: 11px; color: var(--muted); margin-top: 4px;
    font-family: var(--mono);
  }

  /* Typing indicator */
  .typing { display: flex; gap: 4px; padding: 4px 0; }
  .typing span {
    width: 6px; height: 6px; background: var(--muted); border-radius: 50%;
    animation: blink 1.4s infinite both;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:.3} 40%{opacity:1} }

  /* Input area */
  #input-area {
    padding: 16px 20px; border-top: 1px solid var(--border);
    background: var(--surface);
  }
  #input-wrap {
    max-width: 720px; margin: 0 auto; display: flex; gap: 10px;
    align-items: flex-end;
  }
  #prompt {
    flex: 1; resize: none; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; background: var(--bg); color: var(--text);
    font-family: var(--font); font-size: 14px; line-height: 1.5;
    min-height: 42px; max-height: 160px; outline: none;
  }
  #prompt:focus { border-color: var(--accent); }
  #prompt::placeholder { color: var(--muted); }

  #send-btn {
    padding: 10px 18px; border: none; border-radius: 10px;
    background: var(--accent); color: #fff; font-size: 14px;
    cursor: pointer; font-weight: 600; white-space: nowrap;
  }
  #send-btn:hover { background: #4393e6; }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Settings bar */
  #settings {
    display: flex; gap: 16px; align-items: center; max-width: 720px;
    margin: 8px auto 0; font-size: 12px; color: var(--muted);
  }
  #settings label { display: flex; align-items: center; gap: 4px; }
  #settings input, #settings select {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); padding: 3px 6px; font-size: 12px; width: 70px;
  }

  /* Welcome */
  .welcome {
    text-align: center; padding: 40px 20px; color: var(--muted);
    max-width: 480px; margin: auto;
  }
  .welcome h2 { color: var(--text); margin-bottom: 8px; font-size: 18px; }
  .welcome p { line-height: 1.6; font-size: 14px; }
  .welcome .examples { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
  .welcome .examples button {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 10px 14px; cursor: pointer; font-size: 13px;
    text-align: left; transition: border-color 0.15s;
  }
  .welcome .examples button:hover { border-color: var(--accent); }
</style>
</head>
<body>

<header>
  <h1>Tomoul</h1>
  <span class="badge">Qwen3.5-0.8B</span>
  <span class="badge" id="quant-badge">Q8K</span>
  <span class="status online" id="status">Ready</span>
</header>

<div id="chat">
  <div class="welcome">
    <h2>Qwen3.5-0.8B</h2>
    <p>Pure Zig inference — running locally on CPU.</p>
    <div class="examples">
      <button onclick="ask(this.textContent)">Explain what a neural network is in simple terms</button>
      <button onclick="ask(this.textContent)">Write a Python function to compute Fibonacci numbers</button>
      <button onclick="ask(this.textContent)">What is the capital of France?</button>
      <button onclick="ask(this.textContent)">Translate "Hello, how are you?" to French and Japanese</button>
    </div>
  </div>
</div>

<div id="input-area">
  <div id="input-wrap">
    <textarea id="prompt" rows="1" placeholder="Type a message…"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"
      oninput="autoGrow(this)"></textarea>
    <button id="send-btn" onclick="send()">Send</button>
  </div>
  <div id="settings">
    <label>Tokens <input id="max-tokens" type="number" value="256" min="1" max="2048"></label>
  </div>
</div>

<script>
const chatEl = document.getElementById('chat');
const promptEl = document.getElementById('prompt');
const sendBtn = document.getElementById('send-btn');
const statusEl = document.getElementById('status');
let busy = false;

function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

function scrollBottom() {
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addMsg(role, html, meta) {
  // Remove welcome screen on first message
  const welcome = chatEl.querySelector('.welcome');
  if (welcome) welcome.remove();

  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="avatar">${role === 'user' ? 'U' : 'T'}</div>
    <div>
      <div class="bubble">${escapeHtml(html)}</div>
      ${meta ? `<div class="meta">${meta}</div>` : ''}
    </div>`;
  chatEl.appendChild(div);
  scrollBottom();
  return div;
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'typing';
  div.innerHTML = `
    <div class="avatar">T</div>
    <div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div></div>`;
  chatEl.appendChild(div);
  scrollBottom();
}

function removeTyping() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = `status ${cls}`;
}

function ask(text) {
  promptEl.value = text;
  send();
}

async function send() {
  if (busy) return;
  const text = promptEl.value.trim();
  if (!text) return;

  busy = true;
  sendBtn.disabled = true;
  promptEl.value = '';
  promptEl.style.height = 'auto';
  setStatus('Generating…', 'busy');

  addMsg('user', text);
  addTyping();

  try {
    const maxTokens = parseInt(document.getElementById('max-tokens').value, 10) || 256;
    const resp = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: text, max_tokens: maxTokens }),
    });

    removeTyping();

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({ error: resp.statusText }));
      addMsg('bot', `Error: ${err.error || 'Unknown error'}`);
    } else {
      const data = await resp.json();
      const meta = `${data.tokens} tokens · ${data.elapsed_ms.toFixed(0)}ms · ${data.tok_per_s.toFixed(1)} tok/s`;
      addMsg('bot', data.text, meta);
    }
  } catch (err) {
    removeTyping();
    addMsg('bot', `Connection error: ${err.message}`);
  } finally {
    busy = false;
    sendBtn.disabled = false;
    setStatus('Ready', 'online');
    promptEl.focus();
  }
}

// Health check on load
fetch('/api/health').then(r => r.json()).then(d => {
  document.getElementById('quant-badge').textContent =
    d.weights.includes('q8k') ? 'Q8K' : d.weights.includes('f32') ? 'F32' : d.weights;
}).catch(() => setStatus('Offline', ''));
</script>
</body>
</html>
